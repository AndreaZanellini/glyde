name: Release

# Issue #30 / docs/SPEC.md §7 / docs/ROADMAP.md M9.
#
# - A `v*` tag publishes a GitHub Release, but only after the full CI suite
#   (fmt, clippy, tests, benchmarks, licenses) has passed on that commit.
# - `workflow_dispatch` is a dry run: same CI gate, same packages, uploaded as
#   workflow artifacts — nothing is published. Use it to check packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Issue #233: least privilege. Only the job that publishes the Release
# writes; it asks for that itself.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Package ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-21
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No Rust cache here: a release is built from source alone, so nothing
      # restored from an earlier run can end up in the files users download.
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --target ${{ matrix.target }} -p glyde-app

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 \
              | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="glyde-app"))')-dryrun"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      # Unsigned until the Apple Developer account and a Windows code-signing
      # certificate exist (docs/SPEC.md §7, a release blocker for going
      # public). packaging/release-notes.md carries the first-run workaround.
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: packaging/macos/package.sh target/${{ matrix.target }}/release/glyde "${{ steps.version.outputs.version }}" dist

      - name: Package (Linux AppImage + tarball)
        if: runner.os == 'Linux'
        env:
          # Pinned appimagetool; extract-and-run because runners have no FUSE.
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          # Issue #233: the download is checked before it runs.
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "$APPIMAGETOOL_URL" -o "$RUNNER_TEMP/bin/appimagetool"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          PATH="$RUNNER_TEMP/bin:$PATH" packaging/linux/package.sh target/${{ matrix.target }}/release/glyde "${{ steps.version.outputs.version }}" dist

      - name: Package (Windows installer + portable .exe)
        if: runner.os == 'Windows'
        env:
          # Git Bash would rewrite ISCC's `/D...` switches as paths.
          MSYS_NO_PATHCONV: "1"
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/glyde.exe "dist/glyde-$version-windows-x64.exe"
          exe="$(cygpath -w "$PWD/target/${{ matrix.target }}/release/glyde.exe")"
          outdir="$(cygpath -w "$PWD/dist")"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" "/DAppVersion=$version" "/DSourceExe=$exe" "/DOutputDir=$outdir" packaging/windows/glyde.iss

      - name: Assert artifact size budget (<= 50 MB, docs/SPEC.md §5)
        run: |
          ls -la dist
          [ -n "$(ls -A dist)" ] || { echo "::error::no artifacts were produced"; exit 1; }
          for f in dist/*; do
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            [ "$size" -le 52428800 ] || { echo "::error::$f exceeds 50 MB budget"; exit 1; }
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: glyde-${{ matrix.target }}
          path: dist/*

  # Runs on a dry run too, so the checksums and the provenance step are
  # exercised before a real tag depends on them.
  provenance:
    name: Checksums & provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sign the build provenance with a short-lived Sigstore certificate, and
      # store the attestation where `gh attestation verify` finds it.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: glyde-*
          path: dist
          merge-multiple: true
      - name: Expect every SPEC §7 artifact
        run: |
          find dist -type f | sort
          for pattern in '*-macos-arm64.dmg' '*-windows-x64-setup.exe' '*-windows-x64.exe' \
                         '*-linux-x86_64.AppImage' '*-linux-x86_64.tar.gz'; do
            [ -n "$(find dist -type f -name "$pattern")" ] \
              || { echo "::error::missing release artifact $pattern"; exit 1; }
          done
      # One line per file, bare file names, so a user can run `sha256sum -c`
      # in the folder they downloaded to.
      - name: Checksums (SHA256SUMS)
        run: |
          cd dist
          sha256sum -- glyde-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/glyde-*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: provenance
    # A dry run (workflow_dispatch) stops at the uploaded artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          # Unsigned-build workaround steps and the maintainer's smoke-ritual
          # reminder (docs/SPEC.md §7, CLAUDE.md §Release checklist), followed
          # by the generated commit list.
          body_path: packaging/release-notes.md
          generate_release_notes: true
